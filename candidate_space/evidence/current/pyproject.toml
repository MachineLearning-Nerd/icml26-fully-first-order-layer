[project]
name = "ffolayer-reproduction"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
  "cvxpy==1.6.5",
  "cvxpylayers==0.1.9",
  "diffcp==1.1.4",
  "dqp==0.1.1",
  "ecos==2.0.14",
  "marimo==0.18.4",
  "matplotlib==3.10.8",
  "numpy==2.2.4",
  "osqp==1.0.4",
  "psutil==7.2.1",
  "qpsolvers==4.8.2",
  "scipy==1.15.2",
  "scs==3.2.11",
  "tensorboard==2.20.0",
  "threadpoolctl==3.6.0",
  "torch==2.6.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
